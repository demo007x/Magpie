[package]
name = "magpie"
version = "0.1.0"
description = "拾趣 Magpie · 划词即理解的 AI 阅读伴侣"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
core-foundation = "0.10"
md-5 = "0.10"
arboard = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
