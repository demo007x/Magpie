[package]
name = "magpie"
version = "0.1.16"
description = "拾趣 Magpie · 划词即理解的 AI 阅读伴侣"
edition = "2021"
rust-version = "1.80"
default-run = "magpie"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# 开机自启：macOS 走 LaunchAgent，无需手写 SMAppService FFI
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
base64 = "0.22"
# 钉图复制到剪贴板 + Windows OCR 预处理：解码/缩放/编码
# （macOS Vision 直接吃文件路径；Windows 侧统一转 PNG 喂 BitmapDecoder）
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "tiff",
  "webp",
] }
md-5 = "0.10"
# 机翻签名：有道 v3（SHA-256）、腾讯 TC3（HMAC-SHA256 链）、阿里 RPC（HMAC-SHA1+Base64）
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
arboard = "3"
rfd = "0.15"

# 非 macOS 日期实体：本地规则层（正则 + 本地时区日历运算）。
# macOS 走 NSDataDetector，零日期依赖；两端同一 DateHit 契约
[target.'cfg(not(target_os = "macos"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

# macOS 专属 FFI：objc2 系与 CF 桥接（使用点全部 cfg(target_os = "macos") 门控，
# 非 macOS 构建不编译这些 crate——误用面与编译体积双降）
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSAnimation",
  "NSAnimationContext",
  "block2",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSDictionary",
  "NSString",
  "NSURL",
] }
# toast 动画的 ease-out 缓动曲线（CAMediaTimingFunction）
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction"] }
objc2-vision = { version = "0.3", features = [
  "VNRecognizeTextRequest",
  "VNRequest",
  "VNObservation",
  "VNRequestHandler",
] }

# Windows 专属：划词捕获（WH_MOUSE_LL + UIA）、OCR 截屏（GDI BitBlt）、
# Windows.Media.Ocr 识别、不抢焦点/圆角等窗口细节
[target.'cfg(target_os = "windows")'.dependencies]
# WinRT 异步对象（IAsyncOperation/CompletedHandler）0.62 起在 windows-future
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
uiautomation = "0.25.1"

# 本地补丁：修复 wry 上游 #1752 —— WebKit 偶发 nil URL 导致
# url_scheme_handler unwrap panic（extern "C" 不可 unwind，进程 abort）
# 上游修复 PR：tauri-apps/wry#1744（未合并）
[patch.crates-io]
wry = { path = "../vendor/wry" }

[profile.release]
strip = true
lto = true
codegen-units = 1
