<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 拾趣 Magpie · 状态栏托盘模板图：单色黑 + alpha，配 icon_as_template(true)
       系统自动适配明暗菜单栏（浅色渲染黑、深色渲染白）。
       白斑与眼为透明镂空（evenodd 挖孔），模板化后仍有黑白鹊的层次。 -->
  <g transform="translate(256 256) scale(1.35) translate(-256 -256)">
    <g transform="translate(-10,16)">
      <!-- 枝与一片叶 -->
      <path d="M146 374 C 224 362, 336 358, 400 366" stroke="#000000" stroke-width="11" stroke-linecap="round" fill="none"/>
      <ellipse cx="158" cy="366" rx="17" ry="7" fill="#000000" transform="rotate(-28 158 366)"/>

      <!-- 腿 -->
      <path d="M266 316 L 262 366" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
      <path d="M294 312 L 298 362" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

      <!-- 长尾（弧线扫尾） -->
      <path d="M252 254
               C 212 212, 172 152, 132 92
               L 170 82
               C 198 142, 234 202, 272 238
               Z" fill="#000000"/>

      <!-- 身（椭圆）挖白斑孔：evenodd 双子路径 -->
      <g transform="rotate(-16 278 262)">
        <path fill="#000000" fill-rule="evenodd" d="
          M188 262 a90 62 0 1 0 180 0 a90 62 0 1 0 -180 0 Z
          M228 252 a42 22 0 1 0 84 0 a42 22 0 1 0 -84 0 Z"/>
      </g>

      <!-- 颈部融合 -->
      <circle cx="312" cy="208" r="38" fill="#000000"/>

      <!-- 头挖眼孔：evenodd 双子路径 -->
      <path fill="#000000" fill-rule="evenodd" d="
        M293 170 a45 45 0 1 0 90 0 a45 45 0 1 0 -90 0 Z
        M344 160 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 Z"/>

      <!-- 喙 -->
      <path d="M376 156 L 424 172 L 376 188 Z" fill="#000000"/>
    </g>
  </g>
</svg>
