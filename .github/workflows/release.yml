name: Release

# 推送 v* 标签 → 自动构建 macOS Universal 2 与 Windows x64 安装包并创建
# 同一个 Release（两个任务并行跑，tauri-action 对已存在的 Release 直接追加
# 产物）；也可在 Actions 页手动触发（产物在 Artifacts 下载）。
#
# 应用内更新（docs/04 ADR-11）依赖本工作流的三件事：
# 1. bundle.createUpdaterArtifacts: true（tauri.conf.json）→ CLI 产出 .sig，
#    tauri-action 顺手挂上 Release 并组装 latest.json（裸平台键经
#    updaterJsonPreferNsis 指向 NSIS 安装包）；
# 2. macOS 包用自签证书稳定签名身份（Magpie Dev）→ 用户更新后系统授权不重置；
# 3. 应用按固定地址 releases/latest/download/latest.json 拉取清单，缺了它
#    应用内更新检查静默失败（AGENTS.md 发版清单 ④ 有对应核验项）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # tauri-action 创建 Release 需要
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 不写死版本：由 package.json 的 packageManager 字段决定，与本地开发环境一致
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（stable + 双架构目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 稳定签名身份（自签证书，secrets 注入）：TCC 授权锚定证书哈希，所有发版
      # 用同一张证书，用户应用内更新后辅助功能/输入监控/屏幕录制不再重置。
      # 临时 keychain 用后即弃，runner 无状态
      - name: 导入签名证书
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/magpie-dev.p12
          KC_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PWD" build.keychain
          # 显式解锁 + 关自动锁定：keychain 建好默认可自动锁定，锁定后
          # codesign 会等授权 UI，无头 runner 上永远没人点 → 整个签名步骤
          # 挂死（2026-11-22 v0.2.0 两次 run 卡死在 ocr_helper 签名的实证；
          # 旧镜像 11-19 前未触发，macos-latest 滚动镜像后暴露）。unlock 在
          # import 之前做，分区列表授权才落得实
          security unlock-keychain -p "$KC_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/magpie-dev.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PWD" build.keychain
          # 追加而非替换搜索列表：保留 runner 默认 keychain，避免影响后续工具
          ORIG_KCS=$(security list-keychain -d user | tr -d '"')
          security list-keychain -d user -s build.keychain $ORIG_KCS
          rm /tmp/magpie-dev.p12

      # tauri-action 自动执行 pnpm build（beforeBuildCommand）并构建
      # tauri CLI 合并 Universal 包时只处理主程序，不会合并 src/bin 下的额外
      # 二进制（ocr_helper）；先 --no-bundle 预构建，手动 lipo 出通用 ocr_helper，
      # 再让 tauri-action 打包（cargo 已缓存，秒过）
      - name: 预构建并合并 ocr_helper（universal）
        run: |
          pnpm tauri build --target universal-apple-darwin --no-bundle
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/ocr_helper \
            src-tauri/target/x86_64-apple-darwin/release/ocr_helper \
            -output src-tauri/target/universal-apple-darwin/release/ocr_helper

      # 从 CHANGELOG.md 提取当前版本的段落作为 Release Note
      # （发版说明的唯一来源 = CHANGELOG；tag 形如 v0.1.2，对应标题 [0.1.2]）
      - name: 提取 Release Note
        id: relnotes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONUTF8: "1" # 发布说明含中文：强制 UTF-8，防 Windows runner 默认 cp1252 编码崩溃
        run: |
          {
            echo "body<<RELEASE_BODY_EOF"
            python3 -c "import os,re; tag=os.environ['GITHUB_REF_NAME'].lstrip('v'); t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'## \['+re.escape(tag)+r'\][^\n]*\n(.*?)(?=\n## \[|\Z)',t,re.S); print(m.group(1).strip() if m else '拾趣 Magpie '+tag)"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建（Universal 2）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名（updater 产 .app.tar.gz + .sig 并挂 Release）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 覆盖 conf 的 ad-hoc（"-"）：发版统一稳定身份，本地构建不受影响
          APPLE_SIGNING_IDENTITY: Magpie Dev
        with:
          args: --target universal-apple-darwin
          # 内置组装 latest.json：裸平台键 windows-x86_64 指向 NSIS 安装包
          # （默认偏 MSI，项目决策 .msi 不参与应用内更新）；mac 双架构键由
          # updaterJsonKeepUniversal=false（默认）自动拆分
          updaterJsonPreferNsis: true
          # 标签推送时创建 Release 并挂载 dmg/app 产物
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('拾趣 Magpie {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.relnotes.outputs.body || '' }}
          releaseDraft: false
          prerelease: false

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: magpie-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release-windows:
    permissions:
      contents: write # tauri-action 创建/挂载 Release 需要
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 不写死版本：由 package.json 的 packageManager 字段决定，与本地开发环境一致
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      # 单包工程在 src-tauri（根目录无 Cargo.toml），显式指向以命中缓存
      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 从 CHANGELOG.md 提取当前版本的段落作为 Release Note（与 macOS 任务
      # 同源同格式；windows runner 默认 shell 是 pwsh，heredoc 语法须显式 bash；
      # python 默认 stdout 编码是 cp1252，发布说明含中文必须 PYTHONUTF8 强制 UTF-8）
      - name: 提取 Release Note
        id: relnotes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          {
            echo "body<<RELEASE_BODY_EOF"
            python -c "import os,re; tag=os.environ['GITHUB_REF_NAME'].lstrip('v'); t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'## \['+re.escape(tag)+r'\][^\n]*\n(.*?)(?=\n## \[|\Z)',t,re.S); print(m.group(1).strip() if m else '拾趣 Magpie '+tag)"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # 无需 macOS 任务的 ocr_helper 预合并步骤：Windows 单架构，cargo 一次
      # 构建主程序与 src/bin/ocr_helper.exe，tauri 打包器会一并装入 NSIS/MSI。
      # wry 上游补丁以 vendor/ 目录随仓库走（[patch.crates-io] 指向它），CI 直接可用
      - name: 构建（Windows x64）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名（updater 产 NSIS 安装包 + .sig 并挂 Release）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 标签推送时挂载到 macOS 任务创建的同一个 Release
          #（未传 args = 构建当前宿主目标 x86_64-pc-windows-msvc）
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('拾趣 Magpie {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.relnotes.outputs.body || '' }}
          releaseDraft: false
          prerelease: false

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: magpie-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
